[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poverty-targeting"
version = "0.1.0"
description = "Proxy-means-test prediction of multidimensional deprivation (Ghana DHS 2022), served via API and dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Christopher Mbiba" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
# Needed to build the MPI label and train models; the API will not need these.
train = [
  "devecon @ git+https://github.com/Mbibachris/devecon.git@v0.0.2",
  "scikit-learn>=1.5",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/poverty_targeting"]

[tool.hatch.metadata]
allow-direct-references = true  # lets a dependency point at a git tag

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]