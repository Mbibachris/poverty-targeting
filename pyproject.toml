[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poverty-targeting"
version = "0.1.0"
description = "Proxy-means-test prediction of multidimensional deprivation (Ghana DHS 2022), served via API and dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Christopher Mbiba" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
# Everything needed to load a trained model and score households.
serve = ["scikit-learn>=1.5", "lightgbm>=4.3", "joblib>=1.3"]
# Building the MPI label and training models (adds devecon).
train = [
  "poverty-targeting[serve]",
  "devecon @ git+https://github.com/Mbibachris/devecon.git@v0.0.2",
]
# The prediction web service (no devecon: it never computes an MPI).
api = ["poverty-targeting[serve]", "fastapi>=0.115", "uvicorn[standard]>=0.30"]
# The Streamlit dashboard (talks to the API over HTTP; no model code needed).
dashboard = ["streamlit>=1.40", "requests>=2.31", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/poverty_targeting"]

[tool.hatch.metadata]
allow-direct-references = true  # lets a dependency point at a git tag

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["dashboard"]  # dashboard modules are plain scripts, not part of the package