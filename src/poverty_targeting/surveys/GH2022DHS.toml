# Survey config: Ghana Demographic and Health Survey 2022.
# File names are relative to data/raw/dhs/GH2022DHS/ (zips are read directly).

[survey]
id = "GH2022DHS"
country = "Ghana"
iso3 = "GHA"
program = "DHS"
phase = 8
year = 2022

[files]
household = "GHHR8CDT.zip"  # HR: one row per household
persons = "GHPR8CDT.zip"    # PR: one row per household member
kids = "GHKR8CDT.zip"       # KR: births in last 5 years (child-mortality fallback)
gps = "GHGE8AFL.zip"        # GE: displaced cluster coordinates

[anthropometry]
available = true
subsample_var = "hv042"     # 1 = household selected for height/weight measurement

# Country-specific response codes that the standard DHS mapping does not cover.
# Keys are the survey's codes; values must come from the vocabularies in schema.py.
[codes.water_source]
72 = "sachet"               # hv201: sachet water

[codes.sanitation]
16 = "flush_biodigester"    # hv205: flush, bio-digester (biofil)

# Published figures this survey's estimates are validated against (aggregates only).
[reference.global_mpi]
source = "UNDP HDRO & OPHI (2025), MPI 2025 briefing note for Ghana (DHS 2022), Table A"
url = "https://hdr.undp.org/sites/default/files/Country-Profiles/MPI2025/GHA.pdf"
H = 0.248
A = 0.455
M0 = 0.113
vulnerable = 0.200
severe = 0.084
health = 0.251
education = 0.289
living_standards = 0.460