name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,train,api,dashboard]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

  container:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t poverty-api:ci .

      - name: Start container
        run: docker run -d --name api -p 8080:8080 poverty-api:ci

      - name: Wait until healthy
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy within 60 seconds"
          exit 1

      - name: Golden prediction (real model, real container, real HTTP)
        run: |
          curl -sf -X POST http://localhost:8080/predict \
            -H "Content-Type: application/json" \
            -d @examples/predict_request.json > response.json
          python3 -c "
          import json
          r = json.load(open('response.json'))
          print(json.dumps(r, indent=2))
          assert abs(r['probability'] - 0.9798) < 0.001, r['probability']
          assert r['selected'] is True
          "

      - name: Container logs (shown if anything failed)
        if: failure()
        run: docker logs api

  publish:
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push (commit ID tag and latest)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/poverty-targeting-api"
          TAG="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:$TAG"        

  deploy-dashboard:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HF_SPACE: Mbibachris/poverty-targeting-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the Hugging Face client
        run: pip install "huggingface_hub>=0.25"

      - name: Upload the dashboard to its Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/deploy_space.py          